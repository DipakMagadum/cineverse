<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TadiPaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>🎬 TadiPaar</h1>
    <p>Download Movies Instantly!</p>
  </div>

  <!-- Search Bar -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search movies..." />
    <button id="searchBtn">Search</button>
  </div>

  <!-- Quick Links -->
  <div class="section-title">⚡ Quick Links</div>
  <div class="quick-links">
    <button class="quick-btn" data-url="/movies">🎬 All Movies</button>
    <button class="quick-btn" data-url="/watchlist">🔖 Watchlist</button>
    <button class="quick-btn" data-url="/login">👤 Login</button>
    <button class="quick-btn" data-url="/">🏠 Home</button>
  </div>

  <!-- Categories -->
  <div class="section-title">🎭 Categories</div>
  <div class="categories">
    <button class="cat-btn" data-genre="Action">Action</button>
    <button class="cat-btn" data-genre="Drama">Drama</button>
    <button class="cat-btn" data-genre="Comedy">Comedy</button>
    <button class="cat-btn" data-genre="Thriller">Thriller</button>
    <button class="cat-btn" data-genre="Romance">Romance</button>
    <button class="cat-btn" data-genre="Horror">Horror</button>
  </div>

  <!-- Open Website Button -->
  <button class="open-btn" id="openWebsite">
    🚀 Open TadiPaar Website
  </button>

  <!-- Footer -->
  <div class="footer">
    TadiPaar v1.0 • Free Movie Downloads
  </div>

  <script src="popup.js"></script>
</body>
</html>
